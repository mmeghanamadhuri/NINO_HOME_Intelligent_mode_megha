dependencies:
  espressif/esp_websocket_client:
    version: "1.7.0"
  espressif/esp_hosted:
    version: "*"
    rules:
      - if: "target in [esp32p4]"
  espressif/esp_wifi_remote:
    version: "*"
    rules:
      - if: "target in [esp32p4]"
  espressif/usb:
    rules:
      - if: "idf_version >=5.4"
    version: "^1.3.0"
  espressif/usb_host_uvc:
    version: "*"
  espressif/esp-dl:
    version: "^3.3.4"
  espressif/human_face_detect:
    version: "^0.4.1"
  espressif/esp32_p4_function_ev_board:
    version: "*"
    rules:
      - if: "target in [esp32p4]"
  # 2.9.0 renamed DPI vsync to on_frame_buf_complete; IDF 5.5.2 still has on_refresh_done.
  espressif/esp_lvgl_port:
    version: "~2.8.0"
  espressif/mdns:
    version: "*"
  idf: ">=5.5"
